<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <title>Results summary component</title>

</head>
<body>
<div id="mainPart">
  <div id="leftPart">
    <p id="result">Your Result</p>
    <div id="score">
      <p id="sevenSix">76</p>
      <p id="hundred">of 100</p>
    </div>
    <p id="great">Great</p>
    <p id="description">You scored higher than 65% of the people who have taken these tests.</p>
  </div>
  <div id="rightPart">
    <p id="summary">Summary</p>
    <div id="scores">
      <div id="reaction">
        <img src="assets/images/icon-reaction.svg">Reaction <span><strong> 80 </strong> / 100</span>
      </div>
      <div id="memory">
        <img src="assets/images/icon-memory.svg">Memory <span><strong> 92 </strong> / 100</span>
      </div>
      <div id="verbal">
        <img src="assets/images/icon-verbal.svg">Verbal <span><strong> 61 </strong> / 100</span>
      </div>
      <div id="visual">
        <img src="assets/images/icon-visual.svg">Visual <span><strong> 72 </strong> / 100</span>
      </div>
    </div>
    <p id="button"><a href="">Continue</a></p>
  </div>
</div>
</body>
</html>
